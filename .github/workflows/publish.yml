# Publish the extension to Open VSX and the VS Code Marketplace.
#
# Runs when a GitHub release is published (or manually via "Run workflow").
# 1. build-test: npm ci, lint, unit tests, smoke checks, package the store VSIX
#    (no secrets, no approval needed).
# 2. publish: runs in the protected `publish` environment, so it waits for a
#    required reviewer to approve.
#    - Open VSX uses environment secret `OVSX_PAT` and is skipped (with a
#      notice) when that secret is not set.
#    - VS Code Marketplace uses Trusted Publishing (GitHub Actions OIDC).
#      The job always attempts `vsce publish --oidc`. It does not read
#      `VSCE_PAT` and does not fall back to a PAT if the token exchange fails.
#      `VSCE_PAT` is optional/legacy (Azure DevOps PAT) and is unused if still set.
#
# Marketplace Trusted Publishing policy (publisher `bhu`, status Active):
#   Provider: GitHub Actions
#   Repository owner: bhuertgen
#   Repository: grok-build-vscode
#   Workflow: publish.yml
#   Environment: publish
#
# The publish job requests an OIDC token (audience marketplace.visualstudio.com),
# so it needs `permissions: contents: read` and `id-token: write`.
# `@vscode/vsce` 4.x (`publish --oidc`) requires Node.js >= 22.
#
# One-time setup (repo owner): Settings → Environments → environment
# `publish` → required reviewer → environment secret `OVSX_PAT`
# (open-vsx.org access token, namespace `bhu`).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build, test and package (do not publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build, test, package
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pkg.outputs.vsix }}
      prerelease: ${{ steps.pkg.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run smoke

      - name: Package store VSIX
        id: pkg
        env:
          # Store builds never run the GitHub release update check
          # (inlined by esbuild.mjs, see src/util/distribution.ts).
          GROK_BUILD_DISTRIBUTION: store
          PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix="grok-build-vscode-${version}.vsix"
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx @vscode/vsce package --no-dependencies $flags -o "$vsix"
          npx @vscode/vsce ls --no-dependencies
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: Publish to Open VSX + Marketplace
    needs: build-test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: publish
    env:
      VSIX: ${{ needs.build-test.outputs.vsix }}
      PRERELEASE: ${{ needs.build-test.outputs.prerelease }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          # vsce 4.x (publish --oidc) requires Node >= 22. Open VSX uses the same runtime.
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes ovsx publish "$VSIX" $flags -p "$OVSX_PAT"

      - name: Skip Open VSX (no OVSX_PAT)
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT secret is not set in the publish environment; skipped Open VSX."

      # Always attempt Trusted Publishing. vsce does not fall back to VSCE_PAT.
      - name: Publish to VS Code Marketplace
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes @vscode/vsce publish --packagePath "$VSIX" $flags --oidc
