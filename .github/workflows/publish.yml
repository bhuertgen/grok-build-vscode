# Publish the extension to Open VSX and the VS Code Marketplace.
#
# Runs when a GitHub release is published (or manually via "Run workflow").
# 1. build-test: npm ci, lint, unit tests, smoke checks, package the store VSIX
#    (no secrets, no approval needed).
# 2. publish: runs in the protected `publish` environment, so it waits for a
#    required reviewer to approve. Each store is skipped (with a notice) when its
#    secret is not configured.
#
# One-time setup (repo owner): Settings → Environments → New environment
# `publish` → add yourself as required reviewer → add environment secrets
# `OVSX_PAT` (open-vsx.org access token, namespace `bhu`) and `VSCE_PAT`
# (Azure DevOps PAT, scope Marketplace → Manage, publisher `bhu`).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build, test and package (do not publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build, test, package
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pkg.outputs.vsix }}
      prerelease: ${{ steps.pkg.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run smoke

      - name: Package store VSIX
        id: pkg
        env:
          # Store builds never run the GitHub release update check
          # (inlined by esbuild.mjs, see src/util/distribution.ts).
          GROK_BUILD_DISTRIBUTION: store
          PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix="grok-build-vscode-${version}.vsix"
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx @vscode/vsce package --no-dependencies $flags -o "$vsix"
          npx @vscode/vsce ls --no-dependencies
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: Publish to Open VSX + Marketplace
    needs: build-test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    environment:
      name: publish
    env:
      VSIX: ${{ needs.build-test.outputs.vsix }}
      PRERELEASE: ${{ needs.build-test.outputs.prerelease }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes ovsx publish "$VSIX" $flags -p "$OVSX_PAT"

      - name: Skip Open VSX (no OVSX_PAT)
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT secret is not set in the publish environment; skipped Open VSX."

      # Marketplace auth uses a PAT for now. It can later switch to GitHub OIDC
      # (workload identity federation, no long-lived secret; expected ~end of Oct 2026):
      # add `permissions: id-token: write` to this job and replace `-p "$VSCE_PAT"`
      # with the OIDC/Entra login supported by @vscode/vsce at that point.
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes @vscode/vsce publish --packagePath "$VSIX" $flags -p "$VSCE_PAT"

      - name: Skip Marketplace (no VSCE_PAT)
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT secret is not set in the publish environment; skipped VS Code Marketplace."
